name: TVRemote
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  TVDriverKit:
    type: framework
    platform: iOS
    sources: [TVDriverKit]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.adityapunjani.TVRemote.DriverKit
      GENERATE_INFOPLIST_FILE: YES
  TVRemote:
    type: application
    platform: iOS
    sources: [TVRemote]
    dependencies:
      - target: TVDriverKit
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.adityapunjani.TVRemote
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_CFBundleDisplayName: TV Remote
      INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
      MARKETING_VERSION: "0.1.0"
      CURRENT_PROJECT_VERSION: "1"
  TVRemoteTests:
    type: bundle.unit-test
    platform: iOS
    sources: [TVRemoteTests]
    dependencies:
      - target: TVRemote
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.adityapunjani.TVRemote.Tests
      GENERATE_INFOPLIST_FILE: YES
schemes:
  TVRemote:
    build:
      targets:
        TVRemote: all
    test:
      targets:
        - TVRemoteTests
