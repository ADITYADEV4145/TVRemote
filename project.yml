name: TVRemote
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
packages:
  TVRemoteKit:
    path: Packages/TVRemoteKit
targets:
  TVRemote:
    type: application
    platform: iOS
    sources:
      - path: TVRemote
        excludes: [Info.plist]
    dependencies:
      - package: TVRemoteKit
    info:
      path: TVRemote/Info.plist
      properties:
        NSLocalNetworkUsageDescription: Find and control TVs on your local network.
        NSBonjourServices:
          - _roku-ecp._tcp
          - _androidtvremote2._tcp
          - _samsungmsf._tcp
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.adityapunjani.TVRemote
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_CFBundleDisplayName: TV Remote
      INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
      MARKETING_VERSION: "0.1.0"
      CURRENT_PROJECT_VERSION: "1"
  TVRemoteTests:
    type: bundle.unit-test
    platform: iOS
    sources: [TVRemoteTests]
    dependencies:
      - target: TVRemote
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.adityapunjani.TVRemote.Tests
      GENERATE_INFOPLIST_FILE: YES
  TVRemoteUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [TVRemoteUITests]
    dependencies:
      - target: TVRemote
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.adityapunjani.TVRemote.UITests
      GENERATE_INFOPLIST_FILE: YES
  TVRemoteDesignTests:
    type: bundle.ui-testing
    platform: iOS
    sources: [TVRemoteDesignTests]
    dependencies:
      - target: TVRemote
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.adityapunjani.TVRemote.DesignTests
      GENERATE_INFOPLIST_FILE: YES
schemes:
  TVRemote:
    build:
      targets:
        TVRemote: all
    test:
      targets:
        - TVRemoteTests
        - TVRemoteUITests
  TVRemoteDesignReview:
    build:
      targets:
        TVRemote: all
    test:
      targets:
        - TVRemoteDesignTests
